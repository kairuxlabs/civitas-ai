name: Deploy

on:
  push:
    branches: [main]

jobs:
  # ─── Deploy Backend to Render ────────────────────────────────────────────────
  # Render free plan: auto-deploys from GitHub on push to main.
  # No deploy hook needed — this job just confirms the push completed.
  deploy-backend:
    name: Deploy Backend → Render (auto)
    runs-on: ubuntu-latest
    steps:
      - name: Confirm push to main (Render auto-deploys)
        run: echo "Render will auto-deploy from GitHub push. Check dashboard at render.com"

  # ─── Deploy Frontend to Vercel ───────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel (production)
        working-directory: ./frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prod --token=$VERCEL_TOKEN
