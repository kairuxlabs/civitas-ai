services:
  - type: web
    name: civitas-ai-backend
    runtime: docker
    dockerfilePath: Dockerfile.prod
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false          # set manually in Render dashboard from Neon connection string
      - key: GEMINI_API_KEY
        sync: false          # set manually in Render dashboard
      - key: PORT
        value: "8000"
      - key: PYTHONUNBUFFERED
        value: "1"
